<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne — O'Snack Admin</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    svg { width: 64px; height: 64px; margin-bottom: 20px; opacity: .9; }
    h1 { font-size: 22px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
    p { color: #a3a3a3; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main class="card">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#111"/>
      <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="6"/>
      <circle cx="32" cy="32" r="5" fill="#fff"/>
    </svg>
    <h1>Pas de connexion</h1>
    <p>Le dashboard admin a besoin d'une connexion internet pour charger les données (commandes, menu, fidélité).<br/>Vérifiez votre réseau puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
